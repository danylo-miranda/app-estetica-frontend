<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão & Estética</title>
  <!-- Material Symbols Outlined & Fonte Expressive -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="/pages/css/style.css">
</head>
<body>

  <!-- Tela de Login -->
  <div id="login-screen" class="screen active">
    <div class="login-card">
      <span class="material-symbols-outlined logo-icon">spa</span>
      <h1>Estética Js</h1>
      <p>Acesse para gerenciar seus atendimentos</p>
      
      <form id="login-form">
        <div class="input-group">
          <span class="material-symbols-outlined">mail</span>
          <input type="email" id="login-email" placeholder="E-mail" required value="esteticista@clinica.com">
        </div>
        <div class="input-group">
          <span class="material-symbols-outlined">lock</span>
          <input type="password" id="login-password" placeholder="Senha" required value="SenhaSegura123!">
        </div>
        <button type="submit" class="btn-primary">Entrar no Sistema</button>
      </form>
    </div>
  </div>

  <!-- Tela Principal (Dashboard) -->
  <div id="app-screen" class="screen">
    <header class="top-app-bar">
      <div class="brand">
        <span class="material-symbols-outlined">spa</span>
        <span>AGE - Gestão & Estética</span>
      </div>
      <button id="logout-btn" class="btn-icon" title="Sair">
        <span class="material-symbols-outlined">logout</span>
      </button>
    </header>

    <main class="container">
      <!-- Atalhos Rápidos com Ícones (Reduz Digitação) -->
      <section class="quick-actions">
        <h2>Selecione o Procedimento</h2>
        <div class="grid-actions">
          <button type="button" class="chip-card" data-nome="Limpeza de Pele" data-valor="180">
            <span class="material-symbols-outlined">face_5</span>
            <span>Limpeza de Pele</span>
            <small>R$ 180</small>
          </button>
          <button type="button" class="chip-card" data-nome="Peeling Diamantado" data-valor="220">
            <span class="material-symbols-outlined">auto_awesome</span>
            <span>Peeling</span>
            <small>R$ 220</small>
          </button>
          <button type="button" class="chip-card" data-nome="Drenagem Linfática" data-valor="160">
            <span class="material-symbols-outlined">water_drop</span>
            <span>Drenagem</span>
            <small>R$ 160</small>
          </button>
          <button type="button" class="chip-card" data-nome="Massagem Modeladora" data-valor="190">
            <span class="material-symbols-outlined">self_improvement</span>
            <span>Massagem</span>
            <small>R$ 190</small>
          </button>
        </div>
      </section>

      <!-- Form de Registro Rápido -->
      <section class="form-section">
        <form id="atendimento-form" class="express-form">
          <div class="form-row">
            <div class="input-group">
              <span class="material-symbols-outlined">person</span>
              <input type="text" id="nome_paciente" placeholder="Nome do Paciente" required>
            </div>
            
            <div class="input-group">
              <span class="material-symbols-outlined">edit_note</span>
              <input type="text" id="procedimento" placeholder="Procedimento Selecionado" required>
            </div>
          </div>

          <div class="form-row">
            <div class="input-group">
              <span class="material-symbols-outlined">calendar_today</span>
              <input type="datetime-local" id="data_hora" required>
            </div>

            <div class="input-group">
              <span class="material-symbols-outlined">payments</span>
              <input type="number" step="0.01" id="valor" placeholder="Valor (R$)" required>
            </div>
          </div>

          <button type="submit" class="btn-expressive">
            <span class="material-symbols-outlined">add</span>
            Agendar Atendimento
          </button>
        </form>
      </section>

      <!-- Lista de Atendimentos -->
      <section class="list-section">
        <h2>Atendimentos Agendados</h2>
        <div id="atendimentos-list" class="cards-grid">
          <!-- Carregado Dinamicamente -->
        </div>
      </section>
    </main>
  </div>

  <script src="/pages/js/app.js"></script>
</body>
</html>
